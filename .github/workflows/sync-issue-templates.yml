permissions:
  contents: write
  pull-requests: write

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - customer-portal
          - data-platform-docs
          - gitops-config
          - cluster-bootstrap
          - managed-services-api
          - baas-kube-operator
          - Sabaoth-Cloud-UI
          - sabaoth-cloud-cli
      fail-fast: false

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: Sabaoth-Cloud/.github
          token: ${{ secrets.ORG_PAT }}
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Sabaoth-Cloud/${{ matrix.repo }}
          token: ${{ secrets.ORG_PAT }}
          path: target

      - name: Sync issue templates
        run: |
          mkdir -p target/.github/ISSUE_TEMPLATE
          rsync -a --delete source/.github/ISSUE_TEMPLATE/ target/.github/ISSUE_TEMPLATE/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: target
          token: ${{ secrets.ORG_PAT }}
          commit-message: "chore: sync issue templates from .github"
          title: "chore: sync issue templates from .github"
          body: |
            This PR syncs issue templates from the organization's `.github` repository.

            Updated templates:
            - `.github/ISSUE_TEMPLATE/`
          branch: sync/issue-templates
          delete-branch: true
          labels: automated, templates
