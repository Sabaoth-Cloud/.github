name: Add org issues to project

on:
  schedule:
    - cron: "0 * * * *"   # every hour; adjust as needed
  workflow_dispatch:       # lets you run it manually (e.g. to backfill)
    inputs:
      days:
        description: "How many days back to look"
        default: "1"

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add recent issues to the project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: your-org-name          # <-- change me
          PROJECT_NUMBER: 1           # <-- the number in your project's URL
          DAYS: ${{ inputs.days || '1' }}
        run: |
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          echo "Looking for issues in $ORG created since $since"

          gh search issues --owner "$ORG" --created ">=$since" \
            --limit 1000 --json url --jq '.[].url' |
          while read -r url; do
            echo "Adding $url"
            gh project item-add "$PROJECT_NUMBER" --owner "$ORG" --url "$url" > /dev/null \
              || echo "::warning::Could not add $url"
          done
